<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Piano finanziario</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Piano">
<meta name="theme-color" content="#040c06">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#040c06; --fg:#33ff66; --dim:#3fd069; --line:#1f7a3a; --card:#07150b; --track:#14351d; --amber:#ffb000; --red:#ff5050; }
  * { -webkit-tap-highlight-color: transparent; }
  html { color-scheme: dark; }
  body { font-family: 'Courier Prime', 'Courier New', Courier, ui-monospace, monospace; font-size: 16px; line-height: 1.25;
         margin: 0; padding: calc(14px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left)); background: radial-gradient(ellipse at center, #08200f 0%, var(--bg) 75%) fixed; color: var(--fg);
         text-shadow: 0 0 4px rgba(51,255,102,.55), 0 0 12px rgba(51,255,102,.22);
         letter-spacing: .3px; }
  html { background: #040c06; overscroll-behavior-y: none; }
  body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  input { -webkit-user-select: text; user-select: text; }
  #setup { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: var(--bg); z-index: 20; overflow: auto;
         padding: calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom)); }
  #setup.hide { display: none; }
  strong { font-weight: 700; }
  body::after { content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100;
         background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.10) 3px); }
  h1 { font-size: 22px; font-weight: normal; margin: 4px 0 12px; letter-spacing: 1px; }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .sg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { border: 1px solid var(--c); background: #020803; padding: 10px 8px 9px; color: var(--c); text-align: center; min-width: 0;
         box-shadow: 0 0 10px var(--cg), inset 0 0 14px var(--cg); text-shadow: 0 0 4px var(--cg), 0 0 10px var(--cg); }
  .tile .ti { display: block; margin: 0 auto 4px; line-height: 0; filter: drop-shadow(0 0 4px var(--c)); }
  .tile .tl { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; }
  .tile .tv { font-size: 21px; font-weight: 700; margin: 4px 0 3px; white-space: nowrap; }
  .tile .ts { font-size: 11px; opacity: .85; min-height: 28px; line-height: 1.2; }
  .t1 { --c: #33ff66; --cg: rgba(51,255,102,.25); } .t2 { --c: #35e6ff; --cg: rgba(53,230,255,.25); }
  .t3 { --c: #ffb000; --cg: rgba(255,176,0,.25); } .t4 { --c: #ff5ac8; --cg: rgba(255,90,200,.25); }
  .sbar { display: flex; height: 14px; border: 1px solid var(--line); background: var(--track); margin-top: 6px; }
  .sbar i { display: block; height: 100%; }
  .sleg { display: flex; justify-content: space-between; font-size: 11px; margin-top: 5px; }
  .tabs { display: flex; gap: 3px; margin-bottom: 12px; }
  .tabs button { flex: 1; min-width: 0; padding: 8px 0; border: 1px solid var(--fg); border-radius: 0; background: transparent; color: var(--fg);
         font: inherit; font-size: 10px; text-transform: uppercase; letter-spacing: 0; text-shadow: inherit; }
  .tabs button.on { background: var(--fg); color: var(--bg); text-shadow: none; box-shadow: 0 0 10px rgba(51,255,102,.6); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 0; padding: 12px; margin-bottom: 12px;
         box-shadow: 0 0 12px rgba(51,255,102,.12), inset 0 0 18px rgba(51,255,102,.05); }
  label { display: block; font-size: 13px; margin: 10px 0 4px; color: var(--dim); text-transform: uppercase; letter-spacing: 1px; }
  input, select { width: 100%; box-sizing: border-box; padding: 9px 10px; font: inherit; font-size: 16px; color: var(--fg); background: #020803;
         border: 1px solid var(--line); border-radius: 0; caret-color: var(--fg); text-shadow: inherit; }
  input:focus, select:focus { outline: none; border-color: var(--fg); box-shadow: 0 0 8px rgba(51,255,102,.6); }
  ::placeholder { color: #1b5c2d; }
  .go { width: 100%; margin-top: 14px; padding: 10px; font: inherit; font-size: 17px; text-transform: uppercase; letter-spacing: 2px;
         border: 2px solid var(--fg); border-radius: 0; background: var(--fg); color: var(--bg); text-shadow: none; box-shadow: 0 0 12px rgba(51,255,102,.5); }
  .go:disabled { background: var(--track); color: var(--dim); border-color: var(--line); box-shadow: none; }
  .undo { width: 100%; margin-top: 10px; padding: 8px; font: inherit; font-size: 15px; text-transform: uppercase; letter-spacing: 1px;
         border: 1px solid var(--red); border-radius: 0; background: transparent; color: var(--red); text-shadow: 0 0 4px rgba(255,80,80,.5), 0 0 10px rgba(255,80,80,.2); }
  .msg { margin-top: 10px; font-size: 15px; }
  .ok { color: var(--fg); } .err { color: var(--red); text-shadow: 0 0 4px rgba(255,80,80,.5), 0 0 10px rgba(255,80,80,.2); }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  td, th { padding: 5px 4px; text-align: left; border-bottom: 1px dashed var(--line); }
  th { color: var(--dim); text-transform: uppercase; font-weight: normal; }
  td.n, th.n { text-align: right; }
  .bad { color: var(--red); text-shadow: 0 0 4px rgba(255,80,80,.5), 0 0 10px rgba(255,80,80,.2); }
  .good { color: var(--fg); }
  .avviso { background: #1f1600; border: 1px solid var(--amber); color: var(--amber); text-shadow: 0 0 4px rgba(255,176,0,.5), 0 0 10px rgba(255,176,0,.2); padding: 10px; margin-top: 8px; font-size: 15px; }
  .hide { display: none; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 8px; margin-top: 12px; }
  .cap { font-size: 13px; line-height: 1.25; }
  #ov { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.75); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  #ov.hide { display: none; }
  #ov .box { background: var(--card); border: 1px solid var(--fg); padding: 16px; width: 100%; max-width: 360px; box-shadow: 0 0 20px rgba(51,255,102,.4); }
  #ov .btns { display: flex; gap: 8px; margin-top: 14px; }
  #ov .btns button { flex: 1; padding: 10px; font: inherit; font-size: 16px; text-transform: uppercase; border-radius: 0; }
  #ov-ok { background: var(--fg); color: var(--bg); border: 2px solid var(--fg); text-shadow: none; }
  #ov-no { background: transparent; color: var(--fg); border: 1px solid var(--fg); text-shadow: inherit; }

  h1 { display: flex; align-items: center; gap: 10px; }
  .ico { display: inline-block; vertical-align: -4px; margin-right: 6px; line-height: 0; filter: drop-shadow(0 0 3px currentColor); }
  .ico svg { display: block; margin: 0 auto; }
  .tabs button { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .tabs button .ico { margin: 0; }
  .go .ico, .undo .ico, #ov .btns .ico { filter: none; }
  .titlebar { display: flex; align-items: center; gap: 4px; margin: -12px -12px 10px; padding: 3px 8px; background: var(--line); color: var(--bg);
         text-shadow: none; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
  .titlebar span { flex: 1; }
  .titlebar i { width: 8px; height: 8px; background: var(--bg); display: block; }
  .chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .chips.c2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chip { border: 1px solid var(--line); border-radius: 0; background: #020803; color: var(--fg); padding: 8px 2px 6px; font: inherit; font-size: 13px;
         text-transform: uppercase; line-height: 1.1; text-align: center; text-shadow: inherit; overflow-wrap: anywhere; }
  .chip .ico { display: block; margin: 0 auto 3px; }
  .chip.on { background: var(--fg); color: var(--bg); text-shadow: none; box-shadow: 0 0 10px rgba(51,255,102,.6); }
  .chip.on .ico { filter: none; }
  #v-spesa, #v-entrata, #v-giro, #v-rate, #v-riep, #v-saldi { animation: boot .25s steps(5); }
  @keyframes boot { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; transform: none; } }
  circle { transition: stroke-dasharray .9s steps(14); }
  .fill { transition: width .9s steps(14); }
  .cat .ico { display: block; margin: 0 auto 2px; }

  #crt { position: relative; animation: crt-jit .9s steps(1) infinite, crt-flick 3.3s steps(1) infinite, crt-glitch 7s steps(1) infinite; }
  @keyframes crt-jit { 0% { left: 0; top: 0; } 10% { left: .6px; } 20% { left: -.5px; top: .3px; } 30% { left: .3px; top: -.3px; } 40% { left: 0; top: 0; }
         55% { left: -.6px; } 65% { left: .5px; top: .4px; } 80% { left: -.3px; } 90% { left: 0; top: -.3px; } 100% { left: 0; top: 0; } }
  @keyframes crt-flick { 0%, 100% { opacity: 1; } 7% { opacity: .97; } 9% { opacity: 1; } 31% { opacity: .98; } 33% { opacity: 1; }
         58% { opacity: .96; } 60% { opacity: .98; } 61% { opacity: 1; } 83% { opacity: .97; } 85% { opacity: 1; } }
  @keyframes crt-glitch { 0%, 94% { transform: none; } 94.5% { transform: translateX(4px) skewX(-1.2deg); } 95% { transform: translateX(-3px); } 95.5% { transform: translateX(2px) skewX(.8deg); } 96%, 100% { transform: none; } }
  body::before { content: ''; position: fixed; left: 0; right: 0; top: -22vh; height: 22vh; pointer-events: none; z-index: 99;
         background: linear-gradient(to bottom, rgba(51,255,102,0), rgba(51,255,102,.07), rgba(51,255,102,0)); animation: roll 7s linear infinite; }
  @keyframes roll { from { transform: translateY(0); } to { transform: translateY(135vh); } }
  @media (prefers-reduced-motion: reduce) { #crt, body::before { animation: none; } }

  #tv { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 102; opacity: 0; transition: opacity .12s linear;
         image-rendering: pixelated; mix-blend-mode: screen; }
</style>
</head>
<body>
<div id="crt">
<h1><span>&gt; PIANO FINANZIARIO<span class="cur">_</span></span></h1>
<div class="tabs">
  <button id="t-spesa" class="on"><span class="ico" data-ic="shopping-cart"></span>Spesa</button>
  <button id="t-entrata"><span class="ico" data-ic="wallet"></span>Entrata</button>
  <button id="t-giro"><span class="ico" data-ic="refresh"></span>Giro</button>
  <button id="t-rate"><span class="ico" data-ic="calendar"></span>Rate</button>
  <button id="t-riep"><span class="ico" data-ic="chart-line"></span>Riepilogo</button>
  <button id="t-saldi"><span class="ico" data-ic="coins"></span>Saldi</button>
</div>

<div id="v-spesa" class="card">
  <div class="titlebar"><span>SPESA.EXE</span><i></i><i></i><i></i></div>
  <label>Importo (€)</label><input id="s-importo" type="text" inputmode="decimal" placeholder="0,00">
  <label>Categoria</label><div id="s-chips" class="chips"></div><select id="s-cat" class="hide"></select>
  <label>Descrizione</label><input id="s-desc" type="text">
  <label>Data</label><input id="s-data" type="date">
  <label>Note (facoltativo)</label><input id="s-note" type="text">
  <button class="go" id="s-go"><span class="ico" data-ic="save"></span>Registra spesa</button>
  <div class="msg" id="s-msg"></div>
  <button class="undo" onclick="annullaUltimoUI('s-msg')"><span class="ico" data-ic="undo"></span>Annulla ultimo inserimento</button>
</div>

<div id="v-entrata" class="card hide">
  <div class="titlebar"><span>ENTRATA.EXE</span><i></i><i></i><i></i></div>
  <label>Importo (€)</label><input id="e-importo" type="text" inputmode="decimal" placeholder="0,00">
  <label>Tipo</label><div id="e-chips" class="chips c2"></div><select id="e-tipo" class="hide"></select>
  <label>Descrizione</label><input id="e-desc" type="text">
  <label>Data incasso</label><input id="e-data" type="date">
  <label>Mese di competenza</label><input id="e-mese" type="month">
  <label>Note (facoltativo)</label><input id="e-note" type="text">
  <button class="go" id="e-go"><span class="ico" data-ic="save"></span>Registra entrata</button>
  <div class="msg" id="e-msg"></div>
  <button class="undo" onclick="annullaUltimoUI('e-msg')"><span class="ico" data-ic="undo"></span>Annulla ultimo inserimento</button>
</div>

<div id="v-giro" class="card hide">
  <div class="titlebar"><span>GIROCONTO.EXE</span><i></i><i></i><i></i></div>
  <label>Importo (€)</label><input id="g-importo" type="text" inputmode="decimal" placeholder="0,00">
  <label>Data</label><input id="g-data" type="date">
  <label>Note (facoltativo)</label><input id="g-note" type="text">
  <button class="go" id="g-go1"><span class="ico" data-ic="save"></span>Corrente → Deposito</button>
  <button class="go" id="g-go2" style="margin-top:8px"><span class="ico" data-ic="save"></span>Deposito → Corrente</button>
  <div class="msg" id="g-msg"></div>
  <button class="undo" onclick="annullaUltimoUI('g-msg')"><span class="ico" data-ic="undo"></span>Annulla ultimo inserimento</button>
  <div id="g-lista" style="margin-top:12px"></div>
</div>

<div id="v-rate" class="hide">
  <div id="rt-body"></div>
</div>

<div id="v-saldi" class="card hide">
  <div class="titlebar"><span>SALDI.EXE</span><i></i><i></i><i></i></div>
  <div id="sd-body">Caricamento...</div>
  <button class="go" id="sd-go" style="margin-top:12px"><span class="ico" data-ic="refresh"></span>Aggiorna</button>
</div>

<div id="v-riep" class="hide">
  <button class="go" id="r-go" style="margin:0 0 12px"><span class="ico" data-ic="refresh"></span>Aggiorna</button>
  <div id="r-body"></div>
  <button class="undo" id="r-cfg" style="color:var(--dim);border-color:var(--line);text-shadow:none">Collegamento al foglio...</button>
</div>

</div>

<div id="setup" class="hide">
  <div class="card" style="max-width:420px;margin:0 auto">
    <div class="titlebar"><span>COLLEGAMENTO.SYS</span><i></i><i></i><i></i></div>
    <label>URL dell'app Apps Script (finisce con /exec)</label>
    <input id="cfg-url" type="url" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://script.google.com/macros/s/.../exec">
    <label>Chiave</label>
    <input id="cfg-token" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button class="go" id="cfg-go"><span class="ico" data-ic="save"></span>Salva e collega</button>
    <button class="undo hide" id="cfg-no" style="color:var(--fg);border-color:var(--fg);text-shadow:none">Annulla</button>
    <div class="msg" id="cfg-msg"></div>
  </div>
</div>

<div id="ov" class="hide">
  <div class="box">
    <strong id="ov-title">Confermi l'inserimento?</strong>
    <div id="ov-body" style="margin-top:8px"></div>
    <div class="btns">
      <button id="ov-no"><span class="ico" data-ic="close"></span>Annulla</button>
      <button id="ov-ok"><span class="ico" data-ic="check"></span>Conferma</button>
    </div>
  </div>
</div>

<script>
function $(id) { return document.getElementById(id); }
// ---- Collegamento ad Apps Script (API con chiave) ----
var CFG_KEY = 'piano_cfg', cfgMem = null;
function leggiCfg() {
  try { var c = JSON.parse(localStorage.getItem(CFG_KEY) || 'null'); if (c && c.url && c.token) return c; } catch (e) {}
  return cfgMem;
}
function salvaCfg(c) { cfgMem = c; try { localStorage.setItem(CFG_KEY, JSON.stringify(c)); } catch (e) {} }
function urlValido(u) {
  return /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(u) || /^http:\/\/localhost(:\d+)?\//.test(u);
}
function chiamaCon(cfg, fn, args) {
  var ctrl = new AbortController(), to = setTimeout(function () { ctrl.abort(); }, 40000);
  return fetch(cfg.url, {
    method: 'POST', redirect: 'follow', signal: ctrl.signal,
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ token: cfg.token, fn: fn, args: args })
  }).then(function (r) { clearTimeout(to); return r.json(); })
    .then(function (j) {
      if (!j.ok) { var er = new Error(j.error || 'Errore'); er.auth = !!j.auth; throw er; }
      return j.result;
    }, function (e) {
      clearTimeout(to);
      throw new Error(e && e.name === 'AbortError' ? 'Nessuna risposta dal server (timeout)' : 'Collegamento non riuscito: controlla rete e URL');
    });
}
function chiama(fn, args) {
  var cfg = leggiCfg();
  if (!cfg) { mostraSetup(); return Promise.reject(new Error('Collegamento non configurato')); }
  return chiamaCon(cfg, fn, args).catch(function (e) { if (e.auth) mostraSetup('Chiave non valida: reinseriscila'); throw e; });
}
var FUNZIONI_API = ['getConfig', 'aggiungiSpesa', 'aggiungiEntrata', 'aggiungiGiroconto', 'getGiroconti', 'getSaldi', 'getRiepilogo', 'getRate', 'getUltimo', 'annullaUltimo'];
window.google = { script: { get run() {
  var s, f, o = { withSuccessHandler: function (x) { s = x; return o; }, withFailureHandler: function (x) { f = x; return o; } };
  FUNZIONI_API.forEach(function (n) {
    o[n] = function () { chiama(n, Array.prototype.slice.call(arguments)).then(function (r) { if (s) s(r); }, function (e) { if (f) f(e); }); };
  });
  return o;
} } };
function mostraSetup(msg) {
  var c = leggiCfg();
  $('cfg-url').value = c ? c.url : '';
  $('cfg-token').value = '';
  $('cfg-no').classList.toggle('hide', !c);
  setMsg('cfg-msg', msg || '', false);
  $('setup').classList.remove('hide');
}

function oggi() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function el(tag, text, cls) {
  var e = document.createElement(tag);
  if (text !== undefined) e.textContent = text;
  if (cls) e.className = cls;

// Swipe sinistra/destra per cambiare scheda: Spesa <-> Entrata <-> Rate <-> Riepilogo
var ORDINE = ['spesa', 'entrata', 'giro', 'rate', 'riep', 'saldi'];
function schedaCorrente() {
  for (var i = 0; i < ORDINE.length; i++) if ($('t-' + ORDINE[i]).classList.contains('on')) return i;
  return 0;
}
var tx, ty, tstart;
document.addEventListener('touchstart', function (e) {
  var t = e.touches[0]; tx = t.clientX; ty = t.clientY; tstart = e.target;
}, { passive: true });
document.addEventListener('touchend', function (e) {
  if (tx === undefined) return;
  var t = e.changedTouches[0], dx = t.clientX - tx, dy = t.clientY - ty, s = tstart;
  tx = undefined;
  if (!$('ov').classList.contains('hide') || !$('setup').classList.contains('hide')) return;
  if (s && /^(INPUT|SELECT|TEXTAREA)$/.test(s.tagName)) return;
  if (Math.abs(dx) < 60 || Math.abs(dx) < 1.5 * Math.abs(dy)) return;
  var i = schedaCorrente() + (dx < 0 ? 1 : -1);
  if (i < 0 || i >= ORDINE.length) return;
  show(ORDINE[i]);
}, { passive: true });

      var g = el('span', (it.g < 10 ? '0' : '') + it.g); g.style.cssText = 'width:2ch;color:var(--dim)';
      var nome = el('span', (it.pagata ? '✓ ' : '') + it.voce + (it.disdetta ? ' (fino a disdetta)' : '')); nome.style.flex = '1';
      var imp = el('span', fmtEuro(it.importo)); imp.style.whiteSpace = 'nowrap';

function nb(s) { return String(s).replace(/ €/g, '\u00A0€'); }
function num(s) {
  var n = Number(String(s).replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.'));
  return isFinite(n) ? n : 0;
}
function colore(p) { return p > 1 ? '#ff5050' : p >= 0.8 ? '#ffb000' : '#33ff66'; }

// Anello: parte colorata = speso, parte grigia = ancora disponibile
function donut(titolo, speso, previsto, grande) {
  var NS = 'http://www.w3.org/2000/svg';
  var size = grande ? 160 : 104, r = 40, C = 2 * Math.PI * r;
  var p = previsto > 0 ? speso / previsto : (speso > 0 ? 2 : 0);
  var arc = Math.min(p, 1) * C;
  var box = el('div'); box.style.textAlign = 'center';
  var svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 100 100');
  svg.setAttribute('width', size); svg.setAttribute('height', size);
  function cerchio(stroke, dash) {
    var c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', 50); c.setAttribute('cy', 50); c.setAttribute('r', r);
    c.setAttribute('fill', 'none'); c.setAttribute('stroke', stroke); c.setAttribute('stroke-width', 12);
    if (dash) { c.setAttribute('stroke-dasharray', dash); c.setAttribute('transform', 'rotate(-90 50 50)'); }
    return c;
  }
  svg.appendChild(cerchio('#14351d'));
  if (arc > 0) {
    var cArco = cerchio(colore(p), '0 ' + C);
    cArco.style.strokeDasharray = '0 ' + C;
    svg.appendChild(cArco);
    setTimeout(function () { cArco.style.strokeDasharray = arc + ' ' + (C - arc); }, 60);
  }
  var t = document.createElementNS(NS, 'text');
  t.setAttribute('x', 50); t.setAttribute('y', 55); t.setAttribute('text-anchor', 'middle');
  t.setAttribute('font-size', 20); t.setAttribute('font-weight', 700); t.setAttribute('fill', colore(p));
  t.textContent = previsto > 0 ? Math.round(p * 100) + '%' : '+' + fmtEuro(speso);
  if (previsto <= 0) t.setAttribute('font-size', 12);
  svg.appendChild(t);
  box.appendChild(svg);
  var tt = el('div', undefined, 'cap cat');
  tt.appendChild(icona(iconaPer(titolo), 16)); tt.appendChild(document.createTextNode(titolo));
  box.appendChild(tt);
  var resto = previsto - speso;
  var l2 = el('div', 'Speso ' + fmtEuro(speso) + ' su ' + fmtEuro(previsto), 'cap');
  box.appendChild(l2);
  var l3 = el('div', resto >= 0 ? 'Disponibile ' + fmtEuro(resto) : 'Sforato di ' + fmtEuro(-resto), 'cap');
  l3.style.color = resto >= 0 ? '#33ff66' : '#ff5050';
  box.appendChild(l3);
  return box;
}

function renderGrafici(cats) {
  var card = el('div', undefined, 'card');
  var totP = 0, totS = 0;
  cats.forEach(function (c) { totP += c.previsto; totS += c.speso; });
  finestra(card, 'BUDGET.DAT');
  var top = el('div'); top.style.marginTop = '8px';
  top.appendChild(donut('TOTALE', totS, totP, true));
  card.appendChild(top);
  var g = el('div', undefined, 'grid');
  cats.forEach(function (c) {
    if (c.previsto <= 0 && c.speso <= 0) return;
    g.appendChild(donut(c.nome, c.speso, c.previsto, false));
  });
  card.appendChild(g);
  card.appendChild(el('div', 'Verde: sotto l\'80% · Arancione: dall\'80% al 100% · Rosso: sforato', 'cap')).style.marginTop = '10px';
  return card;
}

function renderRiepilogo(d) {
  var body = $('r-body'); body.textContent = '';
  var cats = [];

  // Controllo mese corrente (righe 42-56 di Riepilogo mesi)
  var c = d.controllo;
  var card = el('div', undefined, 'card');
  finestra(card, 'CONTROLLO.SYS');
  card.appendChild(el('strong', 'Mese corrente: ' + (c[1][1] || '') + ' (oggi ' + (c[2][1] || '') + ')'));
  var t = el('table');
  var h = el('tr');
  ['Categoria', 'Previsto', 'Speso', 'Stato'].forEach(function (x, i) { h.appendChild(el('th', x, i === 1 || i === 2 ? 'n' : '')); });
  t.appendChild(h);
  var avviso = '';
  var kv = [];
  for (var i = 4; i < c.length; i++) {
    var r = c[i];
    if (r[3] !== '') {
      cats.push({ nome: r[0], previsto: num(r[1]), speso: num(r[2]) });
      var tr = el('tr');
      var tdn = el('td'); tdn.appendChild(icona(iconaPer(r[0]), 16)); tdn.appendChild(document.createTextNode(r[0]));
      tr.appendChild(tdn);
      tr.appendChild(el('td', nb(r[1]), 'n'));
      tr.appendChild(el('td', nb(r[2]), 'n'));
      var sfor = r[3].indexOf('SFORATO') >= 0;
      var tds = el('td', undefined, sfor ? 'bad' : 'good');
      tds.appendChild(icona(sfor ? 'warning-diamond' : 'check', 16)); tds.appendChild(document.createTextNode(sfor ? 'SFORATO' : r[3]));
      tr.appendChild(tds);
      t.appendChild(tr);
    } else if (r[0] === 'AVVISI') {
      avviso = r[1];
    } else if (r[0] !== '') {
      kv.push(r);
    }
  }
  card.appendChild(t);
  kv.forEach(function (r) {
    var p = el('div'); p.style.marginTop = '6px';
    p.appendChild(el('span', r[0] + ': '));
    p.appendChild(el('strong', r[1]));
    card.appendChild(p);
  });
  if (avviso) card.appendChild(el('div', 'AVVISI: ' + avviso, 'avviso'));
  body.appendChild(renderGrafici(cats));
  body.appendChild(card);

  // Saldi reali
  var s = d.saldi;
  var cs = el('div', undefined, 'card');
  finestra(cs, 'SALDI REALI');
  for (var j = 1; j < s.length; j++) {
    var p2 = el('div'); p2.style.marginTop = '6px';
    p2.appendChild(el('span', s[j][0] + ': '));
    p2.appendChild(el('strong', s[j][1] + ' €'));
    cs.appendChild(p2);
  }
  body.appendChild(cs);

  // Tabella mesi
  var m = d.tabellaMesi;
  var cm = el('div', undefined, 'card');
  finestra(cm, 'MESI.DB');
  var tm = el('table');
  var hm = el('tr');
  ['Mese', 'Versamento', 'Stato', 'Saldo dep.'].forEach(function (x, i) { hm.appendChild(el('th', x, i === 1 || i === 3 ? 'n' : '')); });
  tm.appendChild(hm);
  for (var k = 1; k < m.length; k++) {
    var row = m[k];
    var trm = el('tr');
    trm.appendChild(el('td', row[0]));
    trm.appendChild(el('td', nb(row[4]), 'n'));
    var tdm = el('td', undefined, row[6] === 'OK' ? 'good' : 'bad');
    tdm.appendChild(icona(row[6] === 'OK' ? 'check' : 'warning-diamond', 16)); tdm.appendChild(document.createTextNode(row[6]));
    trm.appendChild(tdm);
    trm.appendChild(el('td', nb(row[7]), 'n'));
    tm.appendChild(trm);
  }
  cm.appendChild(tm);
  body.appendChild(cm);
}

// Disturbo TV (neve elettronica): compare per un istante, ogni tanto, e scorre dall'alto verso il basso
(function () {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var cv = document.createElement('canvas'); cv.id = 'tv'; document.body.appendChild(cv);
  var ctx = cv.getContext('2d');
  // genera una riga di disturbo; g = numero progressivo della riga (decide dove passa la banda luminosa)
  function riga(buf, y, W, g, P) {
    var gain = Math.pow(Math.random(), 3) * 2.4 + 0.12;               // poche righe molto luminose: strisce orizzontali
    var dg = ((g % P) - P / 2) / (P * 0.12), fascia = Math.exp(-dg * dg); // banda luminosa
    var prev = 0, x, i;
    for (x = 0; x < W; x++) {
      var v = Math.random() * Math.random() * 1.8;                     // grana
      v = 0.8 * prev + 0.2 * v; prev = v;                              // forte sbavatura orizzontale
      var punti = (x % 2 === 0) ? 0.5 : 1;                             // trama a puntini
      var bordo = 1 - Math.pow(Math.abs(x / W * 2 - 1), 3) * 0.6;      // bordi più scuri
      var a = Math.min(1, (v * gain + fascia * 0.4) * punti * bordo);
      i = (y * W + x) * 4;
      buf[i] = 40; buf[i + 1] = 255; buf[i + 2] = 110; buf[i + 3] = a * 255;
    }
  }
  function disturbo() {
    var s = 2, W = Math.ceil(innerWidth / s), H = Math.ceil(innerHeight / s);
    cv.width = W; cv.height = H;
    var img = ctx.createImageData(W, H), buf = img.data, g = 0, P = Math.round(H * 1.1), dy = 12, nB = W * 4, y, k;
    for (y = H - 1; y >= 0; y--) riga(buf, y, W, g++, P);              // riempimento iniziale
    ctx.putImageData(img, 0, 0);
    var durata = 400 + Math.random() * 500, t0 = Date.now();
    cv.style.opacity = '.55';
    var iv = setInterval(function () {
      if (Date.now() - t0 > durata) { clearInterval(iv); cv.style.opacity = '0'; return; }
      buf.copyWithin(dy * nB, 0, (H - dy) * nB);                       // tutto scende di dy righe
      for (k = dy - 1; k >= 0; k--) riga(buf, k, W, g++, P);           // nuove righe in alto
      ctx.putImageData(img, 0, 0);
    }, 66);
  }
  window.disturboTV = disturbo;
  function pianifica() { setTimeout(function () { disturbo(); pianifica(); }, 6000 + Math.random() * 10000); }
  setTimeout(function () { disturbo(); pianifica(); }, 3500);
})();
